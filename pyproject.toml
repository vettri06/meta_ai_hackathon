[project]
name = "adaptive_firewall_env"
version = "0.2.0"
description = "Adaptive AI Firewall RL environment for encrypted traffic decision making"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.112",
    "uvicorn>=0.30",
    "numpy>=1.26",
    "pydantic>=2.0",
    "requests>=2.32",
    "openai>=1.30",
    "python-dotenv>=1.0",
]

[project.scripts]
server = "server.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["server"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
